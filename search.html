<meta charset="UTF-8">

<title>Advanced Search - Athletiqo Co.</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
<script>
// Advanced Search Functionality
let currentResults = [];
let activeFilters = {
    category: '',
    subcategory: '',
    minPrice: null,
    maxPrice: null,
    quickFilters: []
};

document.addEventListener('DOMContentLoaded', function() {
    initializeTheme();
    initializeMobileMenu();
    initializeSearch();
    updateCartCount();
    loadAllProducts();
});

function loadAllProducts() {
    currentResults = [...products];
    displayResults(currentResults);
    updateResultsCount(currentResults.length);
}

function performAdvancedSearch() {
    const searchTerm = document.getElementById('search-input').value.toLowerCase();
    
    if (!searchTerm) {
        currentResults = [...products];
    } else {
        currentResults = products.filter(product => 
            product.name.toLowerCase().includes(searchTerm) ||
            product.keywords.some(keyword => keyword.toLowerCase().includes(searchTerm)) ||
            product.category.toLowerCase().includes(searchTerm) ||
            product.subcategory.toLowerCase().includes(searchTerm)
        );
    }
    
    applyFilters();
}

function applyFilters() {
    const category = document.getElementById('category-filter').value;
    const subcategory = document.getElementById('subcategory-filter').value;
    const minPrice = parseFloat(document.getElementById('min-price').value) || null;
    const maxPrice = parseFloat(document.getElementById('max-price').value) || null;
    
    activeFilters.category = category;
    activeFilters.subcategory = subcategory;
    activeFilters.minPrice = minPrice;
    activeFilters.maxPrice = maxPrice;
    
    let filteredResults = [...currentResults];
    
    // Apply category filter
    if (category) {
        filteredResults = filteredResults.filter(product => product.category === category);
    }
    
    // Apply subcategory filter
    if (subcategory) {
        filteredResults = filteredResults.filter(product => product.subcategory === subcategory);
    }
    
    // Apply price filters
    if (minPrice !== null) {
        filteredResults = filteredResults.filter(product => product.price >= minPrice);
    }
    if (maxPrice !== null) {
        filteredResults = filteredResults.filter(product => product.price <= maxPrice);
    }
    
    // Apply quick filters
    activeFilters.quickFilters.forEach(filter => {
        switch(filter) {
            case 'under1000':
                filteredResults = filteredResults.filter(product => product.price < 1000);
                break;
            case '1000to2000':
                filteredResults = filteredResults.filter(product => product.price >= 1000 && product.price <= 2000);
                break;
            case '2000to5000':
                filteredResults = filteredResults.filter(product => product.price >= 2000 && product.price <= 5000);
                break;
            case 'over5000':
                filteredResults = filteredResults.filter(product => product.price > 5000);
                break;
        }
    });
    
    displayResults(filteredResults);
    updateResultsCount(filteredResults.length);
}

function toggleQuickFilter(filterType) {
    const index = activeFilters.quickFilters.indexOf(filterType);
    const button = event.target;
    
    if (index > -1) {
        activeFilters.quickFilters.splice(index, 1);
        button.classList.remove('active');
    } else {
        activeFilters.quickFilters.push(filterType);
        button.classList.add('active');
    }
    
    applyFilters();
}

function sortProducts() {
    const sortBy = document.getElementById('sort-select').value;
    let sortedResults = [...currentResults];
    
    switch(sortBy) {
        case 'price-low':
            sortedResults.sort((a, b) => a.price - b.price);
            break;
        case 'price-high':
            sortedResults.sort((a, b) => b.price - a.price);
            break;
        case 'name':
            sortedResults.sort((a, b) => a.name.localeCompare(b.name));
            break;
        case 'newest':
            sortedResults.sort((a, b) => b.id - a.id);
            break;
        case 'relevance':
        default:
            // Keep original order for relevance
            break;
    }
    
    currentResults = sortedResults;
    applyFilters();
}

function resetFilters() {
    // Reset all filter inputs
    document.getElementById('category-filter').value = '';
    document.getElementById('subcategory-filter').value = '';
    document.getElementById('min-price').value = '';
    document.getElementById('max-price').value = '';
    document.getElementById('sort-select').value = 'relevance';
    
    // Reset active filters
    activeFilters = {
        category: '',
        subcategory: '',
        minPrice: null,
        maxPrice: null,
        quickFilters: []
    };
    
    // Remove active class from quick filter buttons
    document.querySelectorAll('.filter-tag').forEach(tag => {
        tag.classList.remove('active');
    });
    
    // Reload all products
    loadAllProducts();
    showNotification('Filters reset successfully', 'info');
}

function displayResults(results) {
    const resultsContainer = document.getElementById('search-results');
    
    if (results.length === 0) {
        resultsContainer.innerHTML = `
            <div style="text-align: center; padding: 60px 20px; background: var(--bg-card); border-radius: 16px; box-shadow: 0 8px 32px var(--shadow-light); border: 1px solid var(--border-color);">
                <div style="font-size: 4rem; margin-bottom: 2rem;">🔍</div>
                <h3 style="color: var(--text-primary); margin-bottom: 1rem; font-size: 1.5rem;">No products found</h3>
                <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem;">Try adjusting your search terms or filters</p>
                <button onclick="resetFilters()" class="btn btn-primary">
                    Reset Filters
                </button>
            </div>
        `;
        return;
    }
    
    resultsContainer.innerHTML = results.map(product => `
        <div class="card">
            <img src="${product.image}" alt="${product.name}">
            <div class="card-content">
                <h3>${product.name}</h3>
                <p>${product.category.charAt(0).toUpperCase() + product.category.slice(1)} - ${product.subcategory.charAt(0).toUpperCase() + product.subcategory.slice(1)}</p>
                <div class="price">${product.price.toLocaleString('en-IN')}</div>
                <div class="card-actions">
                    <button class="btn btn-success" onclick="addToCart(${product.id})">Add to Cart</button>
                    <a href="${product.buyLink}" target="_blank" class="btn btn-secondary">Buy Now</a>
                </div>
            </div>
        </div>
    `).join('');
}

function updateResultsCount(count) {
    document.getElementById('results-count').textContent = `Showing ${count} product${count !== 1 ? 's' : ''}`;
}

// Enhanced search suggestions
document.getElementById('search-input').addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const suggestionsContainer = document.getElementById('search-suggestions');
    
    if (searchTerm.length < 2) {
        suggestionsContainer.classList.remove('active');
        return;
    }
    
    const suggestions = products
        .filter(product => 
            product.name.toLowerCase().includes(searchTerm) ||
            product.keywords.some(keyword => keyword.toLowerCase().includes(searchTerm))
        )
        .slice(0, 5);
    
    if (suggestions.length > 0) {
        suggestionsContainer.innerHTML = suggestions.map(product => `
            <div class="suggestion-item" onclick="selectSuggestion('${product.name}')">
                <strong>${highlightMatch(product.name, searchTerm)}</strong>
                <div style="font-size: 0.85rem; color: var(--text-secondary);">${product.category} - ${product.subcategory}</div>
            </div>
        `).join('');
        suggestionsContainer.classList.add('active');
    } else {
        suggestionsContainer.classList.remove('active');
    }
});

function highlightMatch(text, searchTerm) {
    const regex = new RegExp(`(${searchTerm})`, 'gi');
    return text.replace(regex, '<strong>$1</strong>');
}

function selectSuggestion(productName) {
    document.getElementById('search-input').value = productName;
    document.getElementById('search-suggestions').classList.remove('active');
    performAdvancedSearch();
}

// Close suggestions when clicking outside
document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-container')) {
        document.getElementById('search-suggestions').classList.remove('active');
    }
});
</script>

<style>
    .search-filters {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 8px 32px var(--shadow-light);
        border: 1px solid var(--border-color);
    }
    
    .filter-group {
        margin-bottom: 1.5rem;
    }
    
    .filter-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--text-primary);
    }
    
    .filter-group select,
    .filter-group input {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .filter-group select:focus,
    .filter-group input:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.1);
    }
    
    .price-range {
        display: flex;
        gap: 1rem;
        align-items: center;
    }
    
    .price-range input {
        flex: 1;
    }
    
    .filter-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
    }
    
    .filter-tag {
        background: var(--accent-gradient);
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
    }
    
    .filter-tag:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
    }
    
    .filter-tag.active {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 2px solid var(--accent-primary);
    }
    
    .sort-options {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
    }
    
    .sort-options select {
        padding: 0.75rem 1rem;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 1rem;
        cursor: pointer;
    }
    
    .results-count {
        color: var(--text-secondary);
        font-weight: 500;
        margin-left: auto;
    }
    
    .search-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-shadow: 0 8px 32px var(--shadow-light);
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
    }
    
    .search-suggestions.active {
        display: block;
    }
    
    .suggestion-item {
        padding: 0.75rem 1rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
        border-bottom: 1px solid var(--border-color);
    }
    
    .suggestion-item:last-child {
        border-bottom: none;
    }
    
    .suggestion-item:hover {
        background: var(--bg-secondary);
    }
    
    .suggestion-item strong {
        color: var(--accent-primary);
    }
    
    @media (max-width: 768px) {
        .search-filters {
            padding: 1.5rem;
        }
        
        .price-range {
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .sort-options {
            flex-direction: column;
            align-items: stretch;
        }
        
        .results-count {
            margin-left: 0;
            margin-top: 1rem;
        }
    }
</style>

<nav>
    <button class="mobile-menu-toggle" aria-label="Toggle mobile menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="nav-container">
        <a href="index.html">Home</a>
        <a href="wear.html">Sports Wear</a>
        <a href="equipment.html">Sports Equipment</a>
        <a href="search.html" class="active">Advanced Search</a>

<section class="hero category-hero">
    <div class="hero-content">
        <h2>Advanced Product Search</h2>
        <p>Find exactly what you're looking for with our powerful search filters</p>
    </div>
</section>

<section class="container">
    <div class="search-filters">
        <h3 style="margin-bottom: 1.5rem; color: var(--text-primary);">Search Filters</h3>
        
        <div class="filter-group">
            <label for="category-filter">Category</label>
            <select id="category-filter" onchange="applyFilters()">
                <option value="">All Categories</option>
                <option value="wear">Sports Wear</option>
                <option value="equipment">Sports Equipment</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="subcategory-filter">Subcategory</label>
            <select id="subcategory-filter" onchange="applyFilters()">
                <option value="">All Subcategories</option>
                <option value="shoes">Shoes</option>
                <option value="tshirt">T-Shirt</option>
                <option value="tracktop">Tracktop</option>
                <option value="trackpant">Trackpant</option>
                <option value="basketball">Basketball</option>
                <option value="cricket">Cricket</option>
                <option value="gym">Gym</option>
                <option value="handgrip">Hand Grip</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>Price Range</label>
            <div class="price-range">
                <input type="number" id="min-price" placeholder="Min" min="0" onchange="applyFilters()">
                <span>-</span>
                <input type="number" id="max-price" placeholder="Max" min="0" onchange="applyFilters()">
            </div>
        </div>
        
        <div class="filter-group">
            <label>Quick Filters</label>
            <div class="filter-tags">
                <button class="filter-tag" onclick="toggleQuickFilter('under1000')">Under ₹1,000</button>
                <button class="filter-tag" onclick="toggleQuickFilter('1000to2000')">₹1,000 - ₹2,000</button>
                <button class="filter-tag" onclick="toggleQuickFilter('2000to5000')">₹2,000 - ₹5,000</button>
                <button class="filter-tag" onclick="toggleQuickFilter('over5000')">Over ₹5,000</button>
                <button class="filter-tag" onclick="toggleQuickFilter('newarrivals')">New Arrivals</button>
                <button class="filter-tag" onclick="toggleQuickFilter('bestsellers')">Best Sellers</button>
            </div>
        </div>
        
        <button onclick="resetFilters()" class="btn btn-outline" style="width: 100%; margin-top: 1rem;">
            Reset All Filters
        </button>
    </div>
    
    <div class="sort-options">
        <label for="sort-select" style="font-weight: 600; color: var(--text-primary);">Sort by:</label>
        <select id="sort-select" onchange="sortProducts()">
            <option value="relevance">Relevance</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name">Name: A to Z</option>
            <option value="newest">Newest First</option>
        </select>
        <div class="results-count" id="results-count">Showing 0 products</div>
    </div>

    </div>
